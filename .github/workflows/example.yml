name: My Example
on: 
    push:
        branches:
            - main
jobs:
    deploy:
        name: Deployment
        runs-on: ubuntu-latest

        #  set up git ? [No] > git clone ได้เลยเพราะมี credential มากับเครื่อง > install and update apt [No need] > zip app > scp > ssh > pm2 stop > remove app > unzip > cd app > install libs > pm2 start > remove zip file
        steps:
            # - run: git clone && git checkout deploy # use marketplace
            - uses: actions/checkout@v4
              name: Pull Code
            # Verify after pull code
            - run: ls -la 
              name: List Files
            # - run: sudo apt-get update # No need to update apt list
            # - run: sudo apt-get install zip # github intall zip มาให้
            # - run: pwd
            - run: cd .. && ls -la && zip -r myapp.zip myapp && ls -la && pwd
              name: Zip App Directory
            # - run: which scp && which ssh 
            - run: echo "${{ secrets.PATIPHON_EC2_TH_SSH_PRIVATE_KEY }}" > /home/runner/work/myapp/server_key.pem
              name: Create Private Key
            - run: chmod 400 /home/runner/work/myapp/server_key.pem
            - run: mkdir ~/.ssh && echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
              name: Add Known Host
            - run: cat ~/.ssh/known_hosts # = /home/runner , ~/home/runner = /home/runner/home/runner
            - run: scp -i /home/runner/work/myapp/server_key.pem /home/runner/work/myapp/myapp.zip ubuntu@43.208.225.24:/home/ubuntu
              name: Send App Directory
            
            
            

    
    