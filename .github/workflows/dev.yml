name: Demo CD
on:
    push: 
        branches:
            - dev
jobs:
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
    # - run: git clone && git checkout deploy # use marketplace
        - uses: actions/checkout@v7
          with:
            ref: dev
          name: Pull Code
        - run: ls -la && git branch
          name: List Files 
        - run: docker build --platform linux/amd64,linux/arm64 -t patiphon28/myweb .
          name: Build Image
        - run: docker images
          name: List Images
        - run: echo "${{ secrets.DOCKER_PASSWORD}}" | docker login --username "${{ secrets.DOCKER_USERNAME}}" --password-stdin
          name: Docker Login
        - run: docker push patiphon28/myapp
          name: Update Image
        