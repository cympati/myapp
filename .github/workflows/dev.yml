name: Demo CD
on:
    push: 
        branches:
            - dev
jobs:
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
          name: Pull Code
        - run: ls -la && git branch
          name: List Files 
        - run: docker build --platform linux/amd64 -t patiphon28/myapp .
          name: Build Image
        - run: docker images
          name: List Images
        - run: echo "${{ secrets.DOCKER_PASSWORD}}" | docker login --username patiphon28 --password-stdin
          name: Docker Login
        - run: docker push patiphon28/myapp
          name: Update Image
        - run: echo "${{ secrets.PATIPHON_EC2_TH_SSH_PRIVATE_KEY }}" > /home/runner/work/myapp/server_key.pem
          name: Create Private Key
        - run: chmod 400 /home/runner/work/myapp/server_key.pem
        - run: mkdir ~/.ssh && echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          name: Add Known Host
        - run: cat ~/.ssh/known_hosts
        - name: "Remote to Server"
          run: |
            ssh -i /home/runner/work/myapp/server_key.pem ubuntu@43.210.194.184 "
                ls -la && pwd
                cd apps
                sudo docker compose pull 
                sudo docker compose up -d
            "